<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BetterJiraWT 選單</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app-container" id="appContainer">
    <!-- 頂部標題列 -->
    <header class="app-header">
      <div class="brand">
        <span class="brand-logo">WT</span>
        <div class="brand-text">
          <h1>BetterJiraWT</h1>
          <p>Jira 擴充與版面美化工具</p>
        </div>
      </div>
    </header>

    <!-- 快捷啟用/停用開關列 -->
    <div class="power-bar" id="powerBar">
      <div class="power-bar-label">
        <span class="power-bar-title">功能啟用狀態</span>
        <span class="power-bar-desc" id="powerStatusDesc">已啟用雙欄版面美化</span>
      </div>
      <label class="toggle-switch" title="快速開啟或關閉 BetterJiraWT 功能">
        <input type="checkbox" id="powerToggle" checked />
        <span class="toggle-slider"></span>
      </label>
    </div>

    <!-- 主選單區塊 -->
    <main class="menu-container">
      <div class="menu-section">
        <button class="menu-group-header expanded" id="settingsToggleBtn" type="button">
          <span class="menu-icon">⚙️</span>
          <span class="menu-title">1. 設定</span>
          <span class="chevron" id="settingsChevron">▾</span>
        </button>

        <div class="submenu-list" id="settingsSubmenu">
          <!-- 1.1 待辦事項網址 -->
          <button class="submenu-item" id="openBacklogModalBtn" type="button">
            <div class="submenu-item-main">
              <span class="submenu-index">1.1</span>
              <div class="submenu-text">
                <span class="submenu-label">待辦事項網址</span>
                <span class="submenu-preview" id="backlogUrlPreview">尚未設定網址</span>
              </div>
            </div>
            <span class="submenu-arrow">›</span>
          </button>

          <!-- 1.2 預設 Sprint -->
          <button class="submenu-item" id="openDefaultSprintModalBtn" type="button">
            <div class="submenu-item-main">
              <span class="submenu-index">1.2</span>
              <div class="submenu-text">
                <span class="submenu-label">預設 Sprint</span>
                <span class="submenu-preview" id="defaultSprintPreview">尚未設定 (依首個衝刺)</span>
              </div>
            </div>
            <span class="submenu-arrow">›</span>
          </button>

          <!-- 1.3 經辦人名單 -->
          <button class="submenu-item" id="openAssigneesModalBtn" type="button">
            <div class="submenu-item-main">
              <span class="submenu-index">1.3</span>
              <div class="submenu-text">
                <span class="submenu-label">經辦人名單</span>
                <span class="submenu-preview" id="assigneesPreview">尚未設定人員 (點擊設定)</span>
              </div>
            </div>
            <span class="submenu-arrow">›</span>
          </button>
        </div>
      </div>
    </main>

    <!-- 狀態列 -->
    <footer class="status-bar" id="statusBar">
      <span class="status-dot" id="statusDot"></span>
      <span class="status-text" id="statusText">已載入 IndexedDB 設定</span>
    </footer>

    <!-- 彈出視窗 1.1：設定 - 待辦事項網址 -->
    <div class="modal-overlay hidden" id="backlogModal">
      <div class="modal-card">
        <div class="modal-header">
          <h2>設定 - 待辦事項網址</h2>
          <button class="close-btn" id="closeBacklogModalBtn" type="button" aria-label="關閉">✕</button>
        </div>
        <div class="modal-body">
          <label for="backlogUrlInput" class="input-label">請輸入「待辦事項 (Backlog)」頁面的網址：</label>
          <input
            type="url"
            id="backlogUrlInput"
            class="url-input"
            placeholder="https://swpc.atlassian.net/jira/software/projects/WMC/boards/391/backlog"
            autocomplete="off"
          />
          <div class="quick-actions">
            <button type="button" class="link-btn" id="useCurrentTabUrlBtn">
              📌 帶入目前分頁網址
            </button>
            <button type="button" class="link-btn" id="useExampleUrlBtn">
              💡 填入範例網址
            </button>
          </div>
          <p class="helper-text">
            設定儲存於前端 IndexedDB，瀏覽器關閉重啟後仍會保留。
          </p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="cancelBacklogBtn">取消</button>
          <button type="button" class="btn btn-primary" id="saveBacklogBtn">儲存設定</button>
        </div>
      </div>
    </div>

    <!-- 彈出視窗 1.2：設定 - 預設 Sprint -->
    <div class="modal-overlay hidden" id="defaultSprintModal">
      <div class="modal-card">
        <div class="modal-header">
          <h2>設定 - 預設 Sprint</h2>
          <button class="close-btn" id="closeDefaultSprintModalBtn" type="button" aria-label="關閉">✕</button>
        </div>
        <div class="modal-body">
          <label for="defaultSprintInput" class="input-label">請輸入每次重新整理自動切換的目標 Sprint 名稱或關鍵字：</label>
          <input
            type="text"
            id="defaultSprintInput"
            class="url-input"
            placeholder="例如：Sprint 23 或 WMC Sprint 23"
            autocomplete="off"
          />
          <p class="helper-text">
            支援完整名稱或部分關鍵字（不分大小寫）。留空時將依預設規則切換至列表第一個衝刺。設定儲存於 IndexedDB。
          </p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="cancelDefaultSprintBtn">取消</button>
          <button type="button" class="btn btn-primary" id="saveDefaultSprintBtn">儲存設定</button>
        </div>
      </div>
    </div>

    <!-- 彈出視窗 1.3：設定 - 經辦人名單 -->
    <div class="modal-overlay hidden" id="assigneesModal">
      <div class="modal-card modal-card-large">
        <div class="modal-header">
          <h2>設定 - 經辦人名單</h2>
          <button class="close-btn" id="closeAssigneesModalBtn" type="button" aria-label="關閉">✕</button>
        </div>
        <div class="modal-body">
          <label class="input-label">新增團隊成員（名稱與 Email）：</label>
          <div class="assignee-input-row">
            <input
              type="text"
              id="newAssigneeNameInput"
              class="assignee-input"
              placeholder="名稱 (例：Ray Huang)"
              autocomplete="off"
            />
            <input
              type="email"
              id="newAssigneeEmailInput"
              class="assignee-input"
              placeholder="Email (例：Ray_Huang@wistron.com)"
              autocomplete="off"
            />
            <button type="button" class="btn btn-primary" id="addAssigneeBtn">新增</button>
          </div>

          <div class="assignees-list-container">
            <div class="assignees-list-header">
              <span>已設定人員列表 (<span id="assigneesCount">0</span>)</span>
              <button type="button" class="link-btn-danger" id="clearAllAssigneesBtn">全部清空</button>
            </div>
            <div class="assignees-list" id="assigneesList">
              <!-- 動態生成人員項目 -->
            </div>
          </div>

          <p class="helper-text">
            設定的人員資料儲存於前端 IndexedDB。看板頂部自製工具列中的「經辦人」將以這些成員為基礎進行比對與篩選。
          </p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="cancelAssigneesBtn">取消</button>
          <button type="button" class="btn btn-primary" id="saveAssigneesBtn">儲存設定</button>
        </div>
      </div>
    </div>
  </div>

  <script src="db.js"></script>
  <script src="popup.js"></script>
</body>
</html>
